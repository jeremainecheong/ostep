<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glossary — Java 21 course</title><style>
/* OSTEP course — shared stylesheet. Three pieces, three hues. */
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
:root{
  --ink:#151b2f; --ink-2:#1e2540; --ink-3:#28304f; --line:#3a4368;
  --paper:#eef0f7; --muted:#a9b1cf; --faint:#6e779a;
  --virt:#e8b84a; --conc:#5bc8f5; --pers:#6bcb77; --sec:#f47fa0; --intro:#c9a8ff; --spec:#ffd166; --internals:#5bc8f5; --data:#6bcb77;
  --ok:#6bcb77; --bad:#ff6b6b;
  --accent:var(--virt);
  --radius:6px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ink);color:var(--paper);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:17px;line-height:1.6}
a{color:var(--accent)}
code,pre,kbd,.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
code{background:var(--ink-3);padding:1px 5px;border-radius:4px;font-size:.9em}
pre{background:#0f1424;border:1px solid var(--line);border-left:4px solid var(--accent);padding:14px 16px;overflow:auto;border-radius:var(--radius);font-size:.86em;line-height:1.5}
pre code{background:none;padding:0;font-size:inherit}
h1,h2,h3,h4{font-family:'Fraunces',Georgia,serif;font-weight:700;line-height:1.15;margin:0 0 .4em}
h1{font-size:2.6rem;letter-spacing:-.01em}
h2{font-size:1.9rem;margin-top:2.6rem;padding-top:1.2rem;border-top:1px solid var(--line)}
h3{font-size:1.3rem;margin-top:1.8rem;color:var(--accent)}
h4{font-size:1.05rem;margin-top:1.2rem}
p,li{max-width:72ch}
.wrap{max-width:1100px;margin:0 auto;padding:0 28px 96px}
.hero{padding:44px 0 16px}
.hero .chapters{color:var(--muted);font-size:.95rem;margin-bottom:6px}
.lede{font-size:1.2rem;color:var(--muted);max-width:66ch}
.piece-lang{--accent:var(--spec)} .piece-jvm{--accent:var(--internals)} .piece-loom{--accent:var(--data)} .piece-spec{--accent:var(--spec)} .piece-internals{--accent:var(--internals)} .piece-data{--accent:var(--data)} .piece-virt{--accent:var(--virt)} .piece-conc{--accent:var(--conc)} .piece-pers{--accent:var(--pers)} .piece-sec{--accent:var(--sec)} .piece-intro{--accent:var(--intro)}
.fig{background:var(--ink-2);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin:22px 0}
.fig figcaption,.cap{color:var(--muted);font-size:.9rem;margin-top:10px}
.fig svg{max-width:100%;height:auto;display:block}
svg text{font-family:'IBM Plex Sans',sans-serif}
svg .mono{font-family:'IBM Plex Mono',monospace}
.crux{border:1px solid var(--accent);border-radius:var(--radius);padding:14px 18px;margin:22px 0;background:color-mix(in srgb,var(--accent) 8%,transparent)}
.crux b{color:var(--accent)}
.tip{border-left:4px solid var(--muted);padding:6px 16px;margin:18px 0;color:var(--muted)}
.tip b{color:var(--paper)}
table{border-collapse:collapse;width:100%;margin:16px 0;font-size:.95rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:500}
td.mono,th.mono{font-family:'IBM Plex Mono',monospace}
button,.btn{font:inherit;font-size:.9rem;background:var(--ink-3);color:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:7px 13px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#111;border-color:var(--accent);font-weight:600}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=range]{accent-color:var(--accent)}
input[type=text],input[type=number],select{font:inherit;background:#0f1424;color:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:6px 10px}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
.controls label{font-size:.9rem;color:var(--muted)}
details{border:1px solid var(--line);border-radius:var(--radius);margin:10px 0;background:var(--ink-2)}
summary{cursor:pointer;padding:12px 16px;font-weight:600;list-style:none}
summary::before{content:"+";display:inline-block;width:1.2em;color:var(--accent)}
details[open] summary::before{content:"–"}
details>div{padding:0 16px 14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin:16px 0}
.card{perspective:900px;min-height:140px;cursor:pointer}
.card .inner{position:relative;width:100%;height:100%;min-height:140px;transition:transform .45s;transform-style:preserve-3d}
.card.flipped .inner{transform:rotateY(180deg)}
.card .face{position:absolute;inset:0;padding:14px;border-radius:var(--radius);border:1px solid var(--line);background:var(--ink-2);backface-visibility:hidden;display:flex;align-items:center;justify-content:center;text-align:center;font-size:.95rem}
.card .back{transform:rotateY(180deg);background:var(--ink-3);border-color:var(--accent);font-size:.88rem;line-height:1.45}
.card .front{font-weight:600}
@media (prefers-reduced-motion:reduce){.card .inner{transition:none}}
.quiz .q{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin:12px 0;background:var(--ink-2)}
.quiz .q p{margin:0 0 10px;font-weight:600}
.quiz .opts{display:grid;gap:8px}
.quiz .opt{text-align:left;background:var(--ink);width:100%}
.quiz .opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--ink))}
.quiz .opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--ink))}
.quiz .why{margin-top:10px;color:var(--muted);font-size:.93rem;display:none}
.quiz .q.done .why{display:block}
.quiz .score{margin-top:12px;font-weight:600}
.stepper .stage{min-height:60px;background:#0f1424;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin:10px 0}
.stepper .idx{color:var(--muted);font-size:.85rem}
.gantt{display:grid;gap:6px;margin:10px 0}
.gantt .row{display:grid;grid-template-columns:60px 1fr;align-items:center;gap:8px;font-size:.85rem}
.gantt .track{position:relative;height:26px;background:#0f1424;border-radius:4px;overflow:hidden}
.gantt .seg{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:.75rem;color:#111;font-weight:600;border-right:1px solid rgba(0,0,0,.3)}
.cells{display:grid;gap:4px;margin:10px 0}
.cell{background:#0f1424;border:1px solid var(--line);border-radius:4px;padding:6px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:.8rem;min-height:36px;display:flex;align-items:center;justify-content:center}
.cell.hit{background:color-mix(in srgb,var(--ok) 35%,#0f1424);border-color:var(--ok)}
.cell.miss{background:color-mix(in srgb,var(--bad) 35%,#0f1424);border-color:var(--bad)}
.cell.active{outline:2px solid var(--accent)}
.cell.free{opacity:.45}
.hl{background:color-mix(in srgb,var(--accent) 30%,transparent);padding:1px 5px;border-radius:3px}
.k{color:var(--accent);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:760px){.two{grid-template-columns:1fr}.topbar{gap:10px}h1{font-size:2rem}}
.nav-bottom{display:flex;justify-content:space-between;gap:16px;margin-top:56px;padding-top:20px;border-top:1px solid var(--line)}
.nav-bottom a{text-decoration:none;padding:12px 16px;border:1px solid var(--line);border-radius:var(--radius);color:var(--paper)}
.source{background:var(--ink-2);border-radius:var(--radius);padding:14px 18px;margin:22px 0;font-size:.95rem}
.source b{color:var(--accent)}
.objectives li{list-style:none;margin:6px 0}
.objectives input{margin-right:8px;accent-color:var(--accent)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
.tag{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-right:6px}
.log{font-family:'IBM Plex Mono',monospace;font-size:.82rem;background:#0f1424;border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;max-height:220px;overflow:auto;white-space:pre-wrap}
@media print{body{background:#fff;color:#111}.topbar,.nav-bottom,button{display:none}.fig,.crux,details,.source{border-color:#bbb;background:#fff}pre{background:#f5f5f5;color:#111}}

/* ---------- site chrome: sticky header + directory drawer ---------- */
.topbar{position:sticky;top:0;z-index:30;display:flex;gap:14px;align-items:center;padding:10px 16px;background:color-mix(in srgb,var(--ink) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);font-size:.9rem}
.topbar .menu{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:1rem}
.topbar .menu span{font-size:.85rem}
.topbar .brand{color:var(--paper);text-decoration:none;font-weight:600;display:flex;align-items:center;gap:8px}
.topbar .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);display:inline-block}
.topbar .links{display:flex;gap:16px;margin-left:8px}
.topbar .links a{color:var(--muted);text-decoration:none}
.topbar .links a:hover{color:var(--paper)}
.topbar .where{margin-left:auto;color:var(--faint);font-variant-numeric:tabular-nums}
.drawer{position:fixed;top:0;left:0;bottom:0;width:min(340px,88vw);background:var(--ink-2);border-right:1px solid var(--line);z-index:50;transform:translateX(-102%);transition:transform .25s;overflow-y:auto;padding:0 0 24px;box-shadow:0 0 40px rgba(0,0,0,.5)}
.drawer-open .drawer{transform:none}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.drawer-open .scrim{opacity:1;pointer-events:auto}
.drawer .dhead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--ink-2)}
.drawer .close,.notes-sheet .close{font-size:1.3rem;line-height:1;padding:4px 10px}
.drawer .dgroup{padding:8px 0 4px}
.drawer .dname{padding:8px 16px 4px;color:var(--accent);font-family:'Fraunces',serif;font-weight:700}
.drawer .ditem{display:flex;gap:10px;align-items:center;padding:9px 16px;color:var(--paper);text-decoration:none;border-left:3px solid transparent;font-size:.92rem}
.drawer .ditem:hover{background:var(--ink-3)}
.drawer .ditem.cur{border-left-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.drawer .ditem .n{color:var(--faint);min-width:1.4em;font-variant-numeric:tabular-nums}
.drawer .ditem .t{flex:1;line-height:1.25}
.drawer .ditem .t small{display:block;color:var(--faint);font-size:.75rem}
.drawer .badges{display:flex;gap:6px;align-items:center}
.drawer .badges i{font-style:normal;color:var(--accent)}
.drawer .badges em{font-style:normal;font-size:.75rem;padding:1px 6px;border-radius:999px;background:var(--ink-3);color:var(--muted);font-variant-numeric:tabular-nums}
.drawer .dfoot{padding:16px;color:var(--faint);font-size:.8rem}
/* ---------- notes: floating button + bottom sheet ---------- */
.notes-fab{position:fixed;right:16px;bottom:16px;z-index:35;display:flex;gap:8px;align-items:center;padding:12px 16px;border-radius:999px;background:var(--accent);color:#111;border:none;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.notes-sheet{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--ink-2);border-top:1px solid var(--line);border-radius:14px 14px 0 0;transform:translateY(105%);transition:transform .25s;box-shadow:0 -10px 40px rgba(0,0,0,.5);max-width:900px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom)}
.notes-open .notes-sheet{transform:none}
.notes-open .notes-fab{display:none}
.notes-sheet .nhead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.notes-sheet .nhead b{flex:1;font-size:.95rem}
.notes-sheet .nstatus{color:var(--faint);font-size:.8rem}
.notes-sheet textarea{display:block;width:100%;min-height:36vh;max-height:60vh;resize:vertical;border:none;background:#0f1424;color:var(--paper);font:inherit;font-size:1rem;line-height:1.5;padding:14px 16px;outline:none}
.notes-sheet .nfoot{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;font-size:.85rem;color:var(--muted)}
/* ---------- wide widgets scroll sideways instead of breaking the page ---------- */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:16px 0}
.tw table{margin:0;min-width:520px}
.fig{overflow-x:auto}
@media (prefers-reduced-motion:reduce){.drawer,.notes-sheet,.scrim{transition:none}}
/* ---------- phones ---------- */

  body{font-size:16px}

}

/* ---------- runnable Python ---------- */
.pyrun{border:1px solid var(--line);border-radius:var(--radius);background:#0f1424;margin:18px 0;overflow:hidden}
.pyrun .pyhead{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-size:.85rem;color:var(--muted);background:var(--ink-2)}
.pyrun .pyhead span:first-child{flex:1;font-weight:600;color:var(--paper)}
.pyrun .pystatus{font-size:.78rem}
.pyrun textarea{display:block;width:100%;border:none;background:#0f1424;color:var(--paper);font-family:'IBM Plex Mono',monospace;font-size:.86rem;line-height:1.5;padding:12px 14px;resize:vertical;outline:none;min-height:60px;tab-size:4}
.pyrun .pyout{font-family:'IBM Plex Mono',monospace;font-size:.86rem;line-height:1.5;padding:12px 14px;margin:0;border:none;border-top:1px solid var(--line);border-left:none;border-radius:0;background:#0a0e1a;color:#cfe3ff;max-height:none;overflow:auto}

</style>
<style>.g{display:grid;grid-template-columns:230px 1fr;gap:6px 18px;font-size:.95rem;margin:12px 0}.g dt{font-weight:600;color:var(--accent)}.g dd{margin:0;color:var(--paper)}.g dd small{color:var(--muted)}.g .hide{display:none}@media(max-width:700px){.g{grid-template-columns:1fr}.g dd{margin-bottom:8px}}</style></head>
<body class="piece-intro"><div class="wrap">
<header class="hero"><div class="chapters">Reference · vocabulary used across all 17 lessons</div><h1>Glossary</h1><p class="lede">Terms as the JLS, the JVMS, the JEPs and the JDK sources define them — one line each, grouped by track, with the lesson number. Filter it or print it.</p></header>
<div class="controls"><label>filter <input type="text" id="f" placeholder="type to filter…" style="width:260px"></label><span class="cap" id="cnt"></span></div>
<div id="all"></div>
<p class="tip">Missing a term? Ask me in the chat and I'll add it with its source.</p>
</div>
<script>
/* Java 21 course — shared components (from the OSTEP course). Every page loads this file (inlined by build.py). */
window.OS = (function () {
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  /* ---------- persistent storage (localStorage on a real site; in-memory fallback in sandboxes) ---------- */
  const mem = {};
  const store = {
    get(k) { try { const v = localStorage.getItem('java21:' + k); return v === null ? (mem[k] ?? null) : JSON.parse(v); } catch (e) { return mem[k] ?? null; } },
    set(k, v) { mem[k] = v; try { localStorage.setItem('java21:' + k, JSON.stringify(v)); } catch (e) {} },
    del(k) { delete mem[k]; try { localStorage.removeItem('java21:' + k); } catch (e) {} },
    keys(prefix) { const out = new Set(Object.keys(mem).filter(k => k.startsWith(prefix))); try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith('java21:' + prefix)) out.add(k.slice(6)); } } catch (e) {} return [...out]; },
    available() { try { localStorage.setItem('java21:test', '1'); localStorage.removeItem('java21:test'); return true; } catch (e) { return false; } }
  };

  /* ---------- course structure ---------- */
  const PIECES = [
    ['lang', 'The language, as specified (JLS 21)', [
      ['0001-types-values-variables', 'Types, values, variables', 'JLS ch 4, 5'],
      ['0002-classes-objects-initialization', 'Classes, objects, initialization order', 'JLS ch 8, 12'],
      ['0003-records-sealed-interfaces', 'Records, sealed types, interfaces', 'JLS §8.10, §8.1.1.2, ch 9'],
      ['0004-generics-and-erasure', 'Generics, wildcards, erasure', 'JLS §4.5–4.10, §8.4.8.3'],
      ['0005-expressions-exceptions-switch', 'Expressions, exceptions, switch & patterns', 'JLS ch 11, 14, 15; JEPs 440/441'],
      ['0006-lambdas-streams', 'Lambdas, method references, streams', 'JLS §15.27, §15.13, java.util.stream'],
      ['0007-java-memory-model', 'The Java memory model', 'JLS ch 17']]],
    ['jvm', 'The JVM (JVMS 21 + HotSpot)', [
      ['0008-class-files-and-bytecode', 'Class files and bytecode', 'JVMS ch 4, 6'],
      ['0009-loading-linking-initialization', 'Loading, linking, initialization, class loaders', 'JVMS ch 5'],
      ['0010-execution-frames-invokedynamic', 'Execution: frames, invoke*, invokedynamic', 'JVMS ch 2, 5.4.3, 6'],
      ['0011-hotspot-jit', 'HotSpot: interpreter, C1/C2, deoptimization', 'compilationPolicy.cpp, c2_globals.hpp'],
      ['0012-heap-gc-generational-zgc', 'Objects, heap, GC, Generational ZGC', 'markWord.hpp, gcConfig.cpp, JEP 439']]],
    ['loom', 'Java 21: virtual threads and new features', [
      ['0013-virtual-threads-model', 'Virtual threads: the model (JEP 444)', 'JEP 444'],
      ['0014-virtual-threads-internals', 'Virtual threads: continuations, carriers, scheduler', 'VirtualThread.java, Continuation.java, freeze/thaw'],
      ['0015-structured-concurrency-scoped-values', 'Structured concurrency & scoped values', 'StructuredTaskScope, ScopedValue (preview)'],
      ['0016-concurrency-toolkit', 'The concurrency toolkit: monitors, locks, executors', 'JLS §17.1–17.3, java.util.concurrent'],
      ['0017-java-21-features', 'What Java 21 adds', 'JEPs 431, 440, 441, 442, 443, 445, 446, 453']]]
  ];
  const LESSONS = PIECES.flatMap(p => p[2].map(l => [l[0], l[1], p[0], l[2]]));
  const title = id => (LESSONS.find(l => l[0] === id) || [])[1] || id;
  let pageId = null, root = '../';

  /* ---------- chrome: sticky header, slide-out directory, notes drawer, prev/next ---------- */
  function chrome(id, rootPath) {
    pageId = id; root = rootPath === undefined ? '../' : rootPath;
    const i = LESSONS.findIndex(l => l[0] === id);
    const isLesson = i >= 0;
    const top = document.createElement('header'); top.className = 'topbar';
    top.innerHTML = `<button class="menu" aria-label="Open directory" aria-expanded="false">☰<span>Directory</span></button>
      <a class="brand" href="${root}index.html"><span class="dot"></span>Java 21 course</a>
      <nav class="links"><a href="${root}reference/glossary.html">Glossary</a><a href="${root}reference/cheatsheets.html">Cheat sheets</a><a href="${root}notes.html">My notes</a></nav>
      ${isLesson ? `<span class="where">${i+1} / ${LESSONS.length}</span>` : ''}`;
    document.body.prepend(top);
    // directory drawer
    const drawer = document.createElement('aside'); drawer.className = 'drawer'; drawer.setAttribute('aria-label', 'Course directory');
    const scores = Object.fromEntries(LESSONS.map(l => [l[0], store.get('quiz:' + l[0])]));
    const notes = new Set(store.keys('notes:').map(k => k.slice(6)).filter(k => (store.get('notes:' + k) || {}).text));
    drawer.innerHTML = `<div class="dhead"><b>Directory</b><button class="close" aria-label="Close">×</button></div>
      <a class="ditem ${id === 'index' ? 'cur' : ''}" href="${root}index.html">Course hub</a>
      ${PIECES.map(([cls, name, ls]) => `<div class="dgroup piece-${cls}"><div class="dname">${name}</div>${ls.map(l => {
        const n = LESSONS.findIndex(x => x[0] === l[0]) + 1, s = scores[l[0]];
        return `<a class="ditem ${l[0] === id ? 'cur' : ''}" href="${root}lessons/${l[0]}.html"><span class="n">${n}</span><span class="t">${l[1]}<small>${l[3]}</small></span><span class="badges">${notes.has(l[0]) ? '<i title="you have notes">✎</i>' : ''}${s ? `<em title="best quiz score">${s.score}/${s.total}</em>` : ''}</span></a>`; }).join('')}</div>`).join('')}
      <div class="dgroup piece-intro"><div class="dname">Reference</div>
        <a class="ditem ${id === 'glossary' ? 'cur' : ''}" href="${root}reference/glossary.html"><span class="t">Glossary</span></a>
        <a class="ditem ${id === 'cheatsheets' ? 'cur' : ''}" href="${root}reference/cheatsheets.html"><span class="t">Cheat sheets</span></a>
        <a class="ditem ${id === 'notes' ? 'cur' : ''}" href="${root}notes.html"><span class="t">My notes &amp; progress</span></a></div>
      <div class="dfoot">${store.available() ? 'Notes and scores are saved in this browser.' : 'Notes and scores are kept for this session only (storage unavailable here).'}</div>`;
    document.body.append(drawer);
    const scrim = document.createElement('div'); scrim.className = 'scrim'; document.body.append(scrim);
    const open = o => { document.body.classList.toggle('drawer-open', o); top.querySelector('.menu').setAttribute('aria-expanded', o); if (o) drawer.querySelector('.cur, .ditem')?.focus(); };
    top.querySelector('.menu').onclick = () => open(!document.body.classList.contains('drawer-open'));
    drawer.querySelector('.close').onclick = () => open(false); scrim.onclick = () => open(false);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') { open(false); notesOpen(false); } });
    // prev/next for lessons
    if (isLesson) {
      const nav = document.createElement('div'); nav.className = 'nav-bottom';
      const prev = LESSONS[i-1], next = LESSONS[i+1];
      nav.innerHTML = (prev ? `<a href="${prev[0]}.html">← ${i}. ${prev[1]}</a>` : '<span></span>') +
                      (next ? `<a href="${next[0]}.html">${i+2}. ${next[1]} →</a>` : `<a href="${root}index.html">Back to course hub →</a>`);
      document.querySelector('.wrap').append(nav);
    }
    // wrap tables so they scroll sideways on phones
    document.querySelectorAll('.wrap table').forEach(t => { if (t.parentElement.classList.contains('tw')) return; const w = document.createElement('div'); w.className = 'tw'; t.replaceWith(w); w.append(t); });
    // notes drawer (every page except the notes page itself)
    if (id !== 'notes') notesUI(id, isLesson ? `${i+1}. ${LESSONS[i][1]}` : (document.title.split(' — ')[0]));
  }

  /* ---------- notes: floating button + bottom sheet, autosaved ---------- */
  let notesOpen = () => {};
  function notesUI(id, label) {
    const btn = document.createElement('button'); btn.className = 'notes-fab'; btn.innerHTML = '✎ <span>Notes</span>'; btn.setAttribute('aria-label', 'Open notes');
    const sheet = document.createElement('section'); sheet.className = 'notes-sheet'; sheet.setAttribute('aria-label', 'Notes for this page');
    const saved = store.get('notes:' + id) || {};
    sheet.innerHTML = `<div class="nhead"><b>Notes · ${esc(label)}</b><span class="nstatus"></span><button class="close" aria-label="Close notes">×</button></div>
      <textarea placeholder="Your notes for this page. Markdown is fine. Saved automatically.">${esc(saved.text || '')}</textarea>
      <div class="nfoot"><span class="ncount"></span><a href="${root}notes.html">All notes &amp; export →</a></div>`;
    document.body.append(btn, sheet);
    const ta = sheet.querySelector('textarea'), status = sheet.querySelector('.nstatus'), count = sheet.querySelector('.ncount');
    const upd = () => { count.textContent = ta.value.trim() ? ta.value.trim().split(/\s+/).length + ' words' : ''; };
    let t; ta.addEventListener('input', () => { status.textContent = 'saving…'; clearTimeout(t); t = setTimeout(() => { store.set('notes:' + id, { text: ta.value, title: label, updated: new Date().toISOString() }); status.textContent = 'saved'; upd(); }, 400); });
    upd();
    notesOpen = o => { document.body.classList.toggle('notes-open', o); if (o) ta.focus(); };
    btn.onclick = () => notesOpen(!document.body.classList.contains('notes-open'));
    sheet.querySelector('.close').onclick = () => notesOpen(false);
  }

  /* ---------- quiz: immediate feedback; best score persisted ---------- */
  function quiz(el, qs) {
    el = typeof el === 'string' ? document.getElementById(el) : el;
    el.classList.add('quiz');
    let score = 0, answered = 0;
    const best = pageId ? store.get('quiz:' + pageId) : null;
    el.innerHTML = qs.map((q, i) => `<div class="q" data-i="${i}"><p>${i+1}. ${q.q}</p>
      <div class="opts">${q.o.map((o, j) => `<button class="opt" data-j="${j}">${esc(o)}</button>`).join('')}</div>
      <div class="why">${q.why}</div></div>`).join('') + `<div class="score">${best ? `Best so far: ${best.score}/${best.total} (${new Date(best.date).toLocaleDateString()})` : ''}</div>`;
    el.querySelectorAll('.q').forEach(qd => {
      const q = qs[+qd.dataset.i];
      qd.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
        if (qd.classList.contains('done')) return;
        qd.classList.add('done'); answered++;
        const j = +b.dataset.j;
        if (j === q.a) { b.classList.add('right'); score++; }
        else { b.classList.add('wrong'); qd.querySelectorAll('.opt')[q.a].classList.add('right'); }
        const s = el.querySelector('.score');
        s.textContent = `${score} / ${answered} correct`;
        if (answered === qs.length) {
          s.textContent += score === qs.length ? ' — all of them. Retry from memory in two days.' : ' — reread the sections you missed, then retry.';
          if (pageId && (!best || score >= best.score)) store.set('quiz:' + pageId, { score, total: qs.length, date: new Date().toISOString() });
        }
      }));
    });
  }


  /* ---------- Java code blocks: annotated, copyable, with a jshell hint (no JVM in the browser) ---------- */
  function py(el, code, opts) {
    el = typeof el === 'string' ? document.getElementById(el) : el; opts = opts || {};
    el.classList.add('pyrun');
    const src = code.trim();
    const preview = /--enable-preview|StructuredTaskScope|ScopedValue|STR\./.test(src);
    el.innerHTML = `<div class="pyhead"><span>Java 21${preview ? ' · needs --enable-preview' : ''}${opts.note ? ' · ' + esc(opts.note) : ''}</span><span class="pystatus">paste into jshell or a scratch file</span><button class="primary copy">Copy</button></div><pre class="pyout" style="display:block;white-space:pre-wrap;margin:0"><code>${esc(src)}</code></pre>`;
    el.querySelector('.copy').onclick = () => { navigator.clipboard && navigator.clipboard.writeText(src).then(() => { el.querySelector('.pystatus').textContent = 'copied'; }).catch(() => {}); };
  }

  /* ---------- flip cards ---------- */
  function cards(el, list) {
    el = typeof el === 'string' ? document.getElementById(el) : el;
    el.classList.add('cards');
    el.innerHTML = list.map(([f, b]) => `<div class="card" tabindex="0" role="button" aria-label="flip card"><div class="inner"><div class="face front">${f}</div><div class="face back">${b}</div></div></div>`).join('');
    el.querySelectorAll('.card').forEach(c => {
      const t = () => c.classList.toggle('flipped');
      c.addEventListener('click', t);
      c.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); t(); } });
    });
  }

  /* ---------- stepper ---------- */
  function stepper(el, steps, render) {
    el = typeof el === 'string' ? document.getElementById(el) : el;
    el.classList.add('stepper');
    let i = 0;
    el.innerHTML = `<div class="controls"><button class="prev">← Back</button><button class="next primary">Next step →</button><span class="idx"></span></div><div class="stage"></div><div class="extra"></div>`;
    const stage = el.querySelector('.stage'), idx = el.querySelector('.idx'), extra = el.querySelector('.extra');
    const draw = () => { stage.innerHTML = steps[i]; idx.textContent = `step ${i+1} / ${steps.length}`; if (render) render(i, extra); };
    el.querySelector('.prev').onclick = () => { i = Math.max(0, i-1); draw(); };
    el.querySelector('.next').onclick = () => { i = Math.min(steps.length-1, i+1); draw(); };
    draw();
  }

  /* ---------- gantt ---------- */
  function gantt(el, rows, total, colors) {
    el = typeof el === 'string' ? document.getElementById(el) : el;
    el.classList.add('gantt');
    const pal = colors || ['#e8b84a','#5bc8f5','#6bcb77','#f47fa0','#c9a8ff','#ffb86b'];
    el.innerHTML = rows.map((r, i) => `<div class="row"><span>${esc(r.name)}</span><div class="track">${r.segs.map(s =>
      `<div class="seg" style="left:${100*s.start/total}%;width:${100*(s.end-s.start)/total}%;background:${pal[i%pal.length]}" title="${s.start}–${s.end}">${(s.end-s.start)/total > .06 ? (s.end-s.start) : ''}</div>`).join('')}</div></div>`).join('') +
      `<div class="row"><span></span><div style="display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted)"><span>0</span><span>${total}</span></div></div>`;
  }

  /* ---------- objectives checklist (persisted) ---------- */
  function objectives(el, items) {
    el = typeof el === 'string' ? document.getElementById(el) : el;
    el.classList.add('objectives');
    const saved = (pageId && store.get('obj:' + pageId)) || [];
    el.innerHTML = items.map((t, i) => `<li><label><input type="checkbox" data-i="${i}" ${saved.includes(i) ? 'checked' : ''}>${t}</label></li>`).join('');
    el.querySelectorAll('input').forEach(c => c.onchange = () => { const s = [...el.querySelectorAll('input:checked')].map(x => +x.dataset.i); if (pageId) store.set('obj:' + pageId, s); });
  }

  return { chrome, quiz, cards, stepper, gantt, objectives, py, esc, store, LESSONS, PIECES, title };
})();

</script><script>OS.chrome('glossary');</script>
<script>
const G={
'The language (JLS 21)':[
['Primitive types','byte 8, short 16, int 32, long 64 (two\'s complement), char 16 unsigned UTF-16 unit, float/double IEEE 754, boolean; defaults 0/false/\\u0000. L1'],
['Computational type','JVM view: boolean/byte/char/short are computed as int; long/double are category 2 (two slots). L1, L8'],
['Widening / narrowing conversion','Implicit lossless-ish widening (byte→…→double, char→int) vs explicit casts keeping low-order bits or saturating float→int (NaN→0). L1'],
['Binary numeric promotion','double > float > long > int for binary operators; small integral operands become int. L1'],
['Boxing identity guarantee','Boxing booleans, bytes, chars ≤ 127 and ints/shorts −128…127 yields identical objects (JLS 5.1.7). L1'],
['Constant variable','final primitive/String initialized by a constant expression; inlined; does not trigger class initialization. L1, L9'],
['Definite assignment','Compile-time proof (JLS ch 16) that a local is assigned before every read. L1'],
['Class initialization order','Constant values, superclass, then static initializers/field initializers in textual order under the init lock (JLS 12.4). L2, L9'],
['Instance creation order','Argument evaluation, super constructor (or this()), instance initializers/field initializers in textual order, constructor body (JLS 12.5). L2'],
['Record class','Shallowly immutable transparent carrier: canonical constructor, private final field + public accessor per component, implicit equals/hashCode/toString. L3'],
['Sealed class/interface','permits a fixed set of direct subtypes (final, sealed or non-sealed); enables exhaustive switches. L3'],
['Default / private interface method','Interface methods with bodies (Java 8 / 9); "class wins" over defaults; diamond conflicts must be overridden. L3'],
['Type erasure','Generic type information removed at compile time; type variables replaced by bounds; raw types; no primitive type arguments. L4'],
['Wildcard / PECS','? extends T (producer, read-only), ? super T (consumer, write-only), ? unbounded. L4'],
['Bridge method','Synthetic method javac emits so an overriding method with a different erased signature still overrides. L4'],
['Reifiable type','Type fully available at run time (non-generic, unbounded wildcard, raw, primitive); required for arrays and instanceof. L4'],
['Heap pollution','A parameterized variable referring to an object not of that parameterization; unchecked warnings mark the risk. L4'],
['Evaluation order','Left operand first, then right; arguments left to right; compound assignment saves the left value first (JLS 15.7). L5'],
['Checked vs unchecked exception','Throwable minus RuntimeException/Error must be declared or caught; try-with-resources closes in reverse order and adds suppressed exceptions. L5'],
['Switch expression','Yields a value; arrow rules without fall-through; must be exhaustive. L5, L17'],
['Pattern (type / record)','instanceof or case label that tests and binds: Type t, Record(p1, p2); flow-scoped pattern variables. L5, L17'],
['Guard','when boolean-expression after a pattern label; not analysed for dominance except constant true. L17'],
['Dominance','Compile error when an earlier case label matches everything a later one matches. L17'],
['Exhaustiveness','Switch covers all possible selector values via type coverage (sealed permits, enums); compiler synthesizes a throwing default. L17'],
['Functional interface','Interface with a single abstract method (JLS 9.8); the target type of lambdas and method references. L6'],
['Lambda','Anonymous function; body sees effectively final locals; this is the enclosing instance; compiled via invokedynamic. L6, L10'],
['Method reference','Type::staticMethod, obj::method, Type::instanceMethod (receiver is first argument), Type::new. L6'],
['Stream','Lazy pipeline of intermediate ops ending in a terminal op; parallel() uses the common ForkJoinPool. L6'],
['Monitor','Per-object reentrant lock used by synchronized; unlock on any exit; deadlock neither prevented nor detected (JLS 17.1). L7, L16'],
['Wait set','Per-object set of threads in Object.wait; spurious wake-ups permitted → wait in a loop. L7, L16'],
['Synchronizes-with','Release→acquire edges: unlock→lock, volatile write→read, thread start→first action, last action→join, interrupt→detection. L7'],
['Happens-before','Program order + synchronizes-with (+ constructor→finalizer), transitively closed; decides which writes a read may see. L7'],
['Data race','Two conflicting accesses (same variable, at least one write) unordered by happens-before. L7'],
['Correctly synchronized','All sequentially consistent executions race-free ⇒ all executions appear sequentially consistent. L7'],
['final field freeze','Final fields set in the constructor are visible correctly to any thread that sees the object after construction, even through a race. L7'],
['Word tearing / 64-bit atomicity','Adjacent bytes must not interfere; non-volatile long/double writes may split into halves; references are atomic. L7']],
'The JVM (JVMS 21 + HotSpot)':[
['Class file','0xCAFEBABE, minor/major (65 = Java 21; minor 65535 = preview), constant pool, access flags, this/super/interfaces, fields, methods, attributes. L8'],
['Constant pool','1-indexed tagged symbol table: Utf8, numeric, Class, String, Fieldref/Methodref, NameAndType, MethodHandle/Type, Dynamic/InvokeDynamic. L8'],
['Descriptor','Field: I J Z B C S F D L…; [ ; method: (params)return. L8'],
['Code attribute','max_stack, max_locals, bytecode, exception table, StackMapTable/LineNumberTable/LocalVariableTable. L8'],
['StackMapTable','Types of locals/stack at branch targets enabling single-pass type-checking verification. L8'],
['Opcode','One byte; ~202 standard instructions; typed by letter i/l/f/d/a; tableswitch/lookupswitch padded. L8'],
['Defining vs initiating loader','The loader that calls defineClass vs any loader the JVM asked; class identity = <name, defining loader>. L9'],
['Run-time package / module','Package or module plus defining loader; basis of package-private and modular access control. L9'],
['Loading constraint','Same-named types referenced across loaders must resolve identically (LinkageError otherwise). L9'],
['Linking','Verification (VerifyError), preparation (statics to defaults), resolution (lazy, memoized). L9'],
['Initialization trigger','new, getstatic/putstatic/invokestatic on the declaring class, static method handles, reflection, subclass init, initial class. L9'],
['Init lock procedure','Wait if in progress by another thread; return if recursive; NoClassDefFoundError if erroneous; superclass first; <clinit>; ExceptionInInitializerError. L9'],
['Frame','Per-invocation locals + operand stack + constant-pool reference; discarded on completion. L10'],
['invokevirtual / invokeinterface / invokespecial / invokestatic / invokedynamic','Virtual dispatch; interface dispatch; constructor/super/private; static; bootstrap-linked call site. L10'],
['Method selection','Private resolved method wins; else receiver class, superclasses, then maximally-specific interface method; package-private overrides only within a run-time package. L10'],
['Bootstrap method','Static method handle invoked once per invokedynamic instruction with (Lookup, name, MethodType, static args); returns a CallSite. L10'],
['Method handle','Typed, directly executable reference to a method/field with bytecode-behaviour kinds; invokeExact has exact bytecode semantics. L10'],
['Tiered compilation','Levels 0 interpreter, 1 C1, 2 C1+counters, 3 C1+full profile, 4 C2; common path 0→3→4. L11'],
['Tier thresholds','Tier3: 200 invocations or >100 with inv+backedges > 2000; Tier4: 5000 or >600 with > 15000; OSR 60000/40000. L11'],
['OSR','On-stack replacement of a hot loop\'s interpreter frame by compiled code. L11'],
['Inlining limits','MaxInlineSize 35, FreqInlineSize 325 (x86), InlineSmallCode 1000, MaxInlineLevel 15, MaxRecursiveInlineLevel 1. L11'],
['Uncommon trap / deoptimization','Speculation failure returns compiled code to the interpreter by reconstructing frames from debug info at a safepoint. L11'],
['Escape analysis','C2 scalar-replaces non-escaping objects and elides their locks. L11'],
['Safepoint / handshake','Point with fully known thread state; polls at returns/back-edges; VMThread rolls all threads to it; handshakes target one thread. L11'],
['Mark word','64-bit header word: unused:25 | hash:31 | unused:1 | age:4 | unused:1 | lock:2. L12'],
['Lock bits','01 unlocked, 00 locked (stack/fast lock), 10 inflated ObjectMonitor, 11 GC-marked; all-zero inflating. L12'],
['TLAB','Thread-local allocation buffer; bump-pointer allocation. L12'],
['Remembered set / write barrier','Records old→young pointers so young collections skip the old generation; card table or bitmap. L12'],
['Default GC','G1 on server-class machines (≥ 2 CPUs, ≥ 2 GB), else Serial. L12'],
['Colored pointer','ZGC heap reference with metadata in the low bits; load barrier strips/remaps, store barrier colors/records/marks (SATB). L12'],
['Generational ZGC','JEP 439: young/old generations collected independently and concurrently, pauses < 1 ms, no generation tuning; -XX:+ZGenerational in 21. L12'],
['Soft / weak / phantom reference','Cleared under memory pressure / when unreachable / after finalization (Cleaner). L12']],
'Java 21: virtual threads and new features':[
['Little\'s Law','Concurrency = throughput × latency; thread-per-request needs threads to scale with throughput. L13'],
['Virtual thread','java.lang.Thread not tied to an OS thread; M:N scheduled by the JDK; always daemon, NORM_PRIORITY. L13'],
['Carrier','Platform thread (CarrierThread extends ForkJoinWorkerThread) on which a virtual thread is mounted. L13, L14'],
['Mount / unmount','Scheduling onto a carrier / releasing it when blocking in the JDK. L13'],
['Pinning','Cannot unmount inside synchronized or native frames; blocking there blocks the carrier; JFR VirtualThreadPinned, jdk.tracePinnedThreads. L13, L14'],
['Compensation','Scheduler adds carriers (up to maxPoolSize) when one is captured by file I/O or Object.wait. L13, L14'],
['Virtual-thread scheduler','FIFO work-stealing ForkJoinPool; parallelism = processors; maxPoolSize = max(parallelism, 256); minRunnable = max(parallelism/2, 1). L14'],
['VirtualThread states','NEW, STARTED, RUNNING, PARKING, PARKED, PINNED, TIMED_*, UNPARKED, YIELDING, YIELDED, TERMINATED. L14'],
['Continuation','Internal delimited continuation: run(), yield(scope); Pinned reasons NATIVE/MONITOR/CRITICAL_SECTION. L14'],
['Freeze / thaw','Copying continuation frames into/out of heap StackChunk objects; ~100–150 ns budget; return barrier thaws lazily. L14'],
['Stack chunk','Heap object holding a virtual thread\'s frozen frames; not a GC root. L13, L14'],
['StructuredTaskScope','Preview: fork()→Subtask, join(), shutdown(), close() by the owner; ShutdownOnFailure / ShutdownOnSuccess; handleComplete hook; scope tree. L15'],
['ScopedValue','Preview: immutable per-thread binding for a dynamic scope (runWhere/callWhere), rebinding, inherited by forked subtasks. L15'],
['AbstractQueuedSynchronizer','Atomic int state + tryAcquire/tryRelease + FIFO queue parked via LockSupport; base of ReentrantLock, Semaphore, CountDownLatch. L16'],
['LockSupport permit','At most one per thread; park consumes or blocks (spurious returns); unpark supplies. L16'],
['ThreadPoolExecutor','core/max/keep-alive/queue/rejection handler; extra threads only when the queue is full. L16'],
['ForkJoinPool','Work-stealing deques; asyncMode FIFO; common pool for parallel streams; ManagedBlocker compensation. L16'],
['Sequenced collections','JEP 431: reversed(), getFirst/getLast, addFirst/addLast, removeFirst/removeLast on List, Deque, LinkedHashSet, SortedSet; SequencedMap. L17'],
['Record pattern','Deconstructs a record by accessors; nests; var; never matches null; accessor exception → MatchException. L17'],
['MatchException','Thrown when no case applies at run time in a pattern switch or a pattern completes abruptly. L17'],
['Preview feature','Fully specified but not final; javac/java --enable-preview; class-file minor 65535. L8, L15, L17']]};
const all=document.getElementById('all');let total=0;
all.innerHTML=Object.entries(G).map(([sec,items])=>{total+=items.length;return `<h2>${sec}</h2><dl class="g">${items.map(([t,d])=>`<dt>${OS.esc(t)}</dt><dd>${OS.esc(d).replace(/ (L\d+(?:, L\d+)*)$/,' <small>$1</small>')}</dd>`).join('')}</dl>`;}).join('');
const f=document.getElementById('f'),cnt=document.getElementById('cnt');
function filt(){const q=f.value.trim().toLowerCase();let n=0;all.querySelectorAll('dl.g').forEach(dl=>{let any=false;[...dl.querySelectorAll('dt')].forEach(dt=>{const dd=dt.nextElementSibling;const hit=!q||(dt.textContent+' '+dd.textContent).toLowerCase().includes(q);dt.classList.toggle('hide',!hit);dd.classList.toggle('hide',!hit);if(hit){any=true;n++;}});dl.previousElementSibling.classList.toggle('hide',!any);});cnt.textContent=`${n} of ${total} terms`;}
f.addEventListener('input',filt);filt();
</script></body></html>
